
@if (auth.logueado()) {

    <app-menucomponent></app-menucomponent>

    <router-outlet></router-outlet>

} @else {

    @if (vistaPublica() === 'landing') {
        <app-landingcomponent
            (iniciarSesion)="vistaPublica.set('login')"
            (crearCuenta)="vistaPublica.set('registro')">
        </app-landingcomponent>
    } @else {
        <app-logincomponent
            [registroInicial]="vistaPublica() === 'registro'"
            (volverLanding)="vistaPublica.set('landing')">
        </app-logincomponent>
    }

}
