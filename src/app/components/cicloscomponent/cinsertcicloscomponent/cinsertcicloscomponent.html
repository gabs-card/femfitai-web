

<div class="container">
    <div>
        <h2>Registro de ciclos</h2>
        <p class="descripcion">Un nuevo registro para seguir conociendo tu ritmo.</p>
    </div>

    <div>
        <form [formGroup]="form" (ngSubmit)="registrarCiclo()">

            <mat-form-field class="example-full-width">
                <mat-label>Fecha de inicio</mat-label>
                <input matInput
                    [matDatepicker]="picker1"
                    [max]="hoy"
                    formControlName="fechaInicio">
                <mat-hint>DD/MM/YYYY</mat-hint>
                <mat-datepicker-toggle matIconSuffix [for]="picker1">
                </mat-datepicker-toggle>
                <mat-datepicker #picker1></mat-datepicker>
            </mat-form-field>
            <p class="ayuda">El fin estimado (28 días después) lo calcula el sistema.</p>

            <button matButton class="boton-principal" type="submit">Registrar</button>

        </form>

        @if (mensaje) {
            <p class="aviso" [class.aviso-ok]="mensaje.endsWith('correctamente.')" role="alert">{{ mensaje }}</p>
        }
    </div>
</div>
