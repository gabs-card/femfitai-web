
@if (mostrarRegistro()) {

    <app-usuarioscomponent
        (volverLogin)="volverLogin()"
        (cuentaCreada)="cuentaCreada()">

    </app-usuarioscomponent>

} @else {

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-brand">
                FemFitAI
            </div>

            <h2>Bienvenida a FemFitAI</h2>

            <p class="auth-description">
                Inicia sesión para continuar con tu entrenamiento.
            </p>

            <form
                class="auth-form"
                (submit)="$event.preventDefault(); iniciarSesion(correo.value, password.value); password.value = ''">

                <div class="form-group">
                    <label for="correo">Correo electrónico</label>

                    <input
                        #correo
                        id="correo"
                        name="correo"
                        type="email"
                        placeholder="ejemplo@correo.com"
                        autocomplete="username"
                        required
                        [disabled]="cargando()">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>

                    <input
                        #password
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                        [disabled]="cargando()">
                </div>

                <button
                    class="btn-login"
                    type="submit"
                    [disabled]="cargando() || usuariosService.cargando()">

                    {{ cargando() ? 'Ingresando...' : 'Iniciar sesión' }}

                </button>

            </form>

            @if (mensaje()) {
                <p class="auth-mensaje aviso" [class.aviso-ok]="mensaje().endsWith('correctamente.')" role="alert">
                    {{ mensaje() }}
                </p>
            }

            <div class="auth-footer">
                <span>¿No tienes una cuenta?</span>

                <button
                    type="button"
                    class="btn-registro"
                    (click)="abrirRegistro()">

                    Crear cuenta

                </button>
            </div>

        </section>

    </main>

}
