<h2>Acceso al listado de FemFitAI</h2>
<form (submit)="$event.preventDefault(); iniciarSesion(correo.value, password.value); password.value = ''">
  <label for="correo">Correo</label>
  <input #correo id="correo" name="correo" type="email" autocomplete="username" required [disabled]="cargando()">

  <label for="password">Contraseña</label>
  <input #password id="password" name="password" type="password" autocomplete="current-password" required [disabled]="cargando()">

  <button type="submit" [disabled]="cargando() || usuariosService.cargando()">
    {{ cargando() ? 'Ingresando...' : 'Iniciar sesión' }}
  </button>
</form>
<p role="status">{{ mensaje() }}</p>
