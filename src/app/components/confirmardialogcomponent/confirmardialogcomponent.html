<h2 mat-dialog-title>{{ datos.titulo }}</h2>
<mat-dialog-content>{{ datos.mensaje }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" [mat-dialog-close]="false">
    {{ datos.cancelar ?? 'Cancelar' }}
  </button>
  <button matButton="filled" type="button" [mat-dialog-close]="true" cdkFocusInitial>
    {{ datos.confirmar ?? 'Confirmar' }}
  </button>
</mat-dialog-actions>
