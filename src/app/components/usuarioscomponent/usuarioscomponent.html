<div class="container-registro">
  <h2>Crear cuenta</h2>
  <p>Completa tus datos para registrarte en FemFitAI.</p>

  <form [formGroup]="form" #f="ngForm" (ngSubmit)="registrarUsuario(f)">
    <mat-form-field class="example-full-width">
      <mat-label>Nombres</mat-label>
      <input matInput formControlName="nombres" autocomplete="given-name" />
      <mat-error>Los nombres son obligatorios</mat-error>
    </mat-form-field>

    <mat-form-field class="example-full-width">
      <mat-label>Apellidos</mat-label>
      <input matInput formControlName="apellidos" autocomplete="family-name" />
      <mat-error>Los apellidos son obligatorios</mat-error>
    </mat-form-field>

    <mat-form-field class="example-full-width">
      <mat-label>Correo electrónico</mat-label>
      <input matInput type="email" formControlName="correo" autocomplete="username" />
      <mat-error>Ingresa un correo válido</mat-error>
    </mat-form-field>

    <mat-form-field class="example-full-width">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="passwordHash" autocomplete="new-password" />
      <mat-error>Mínimo 8 caracteres</mat-error>
    </mat-form-field>

    <button matButton="filled" type="submit">Crear cuenta</button>
    <button matButton type="button" (click)="regresar()">Volver al inicio de sesión</button>
  </form>

  @if (mensaje) {
    <p class="aviso" [class.aviso-ok]="mensaje.endsWith('correctamente.')" role="alert">{{ mensaje }}</p>
  }
</div>
